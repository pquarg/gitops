apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-api
spec:
  ingressClassName: traefik
  rules:
    - host: demo-api.localhost # Matches the hostname in the browser's request.
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-api # Matches service.yaml's metadata.name.
                port:
                  number: 80
