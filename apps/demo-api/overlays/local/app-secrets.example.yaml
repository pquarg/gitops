# Copy to app-secrets.yaml and set AUTH_DATABASE_URL using the Compose app login:
# postgresql://myfastapiapp:ENCODED_PASSWORD@host.docker.internal:5433/myfastapiapp?sslmode=disable
# Docker Desktop local only. AWS retains verified TLS in its own overlay.
# Keep the filled file out of Git and out of kustomization.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: demo-api-secrets
  namespace: demo-api
type: Opaque
stringData:
  AUTH_DATABASE_URL: ""
