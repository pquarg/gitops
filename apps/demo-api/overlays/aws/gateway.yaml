apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: demo-api
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  gatewayClassName: alb
  infrastructure:
    parametersRef:
      group: gateway.k8s.aws
      kind: LoadBalancerConfiguration
      name: demo-api
  listeners:
    - name: web
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
