apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-api # Matches template.metadata.labels below.
  template:
    metadata:
      labels:
        app: demo-api # Also selected by service.yaml's spec.selector.
    spec:
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: api
          # The app's kustomization.yaml supplies the release tag.
          image: ghcr.io/pquarg/demo-api
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: AUTH_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: demo-api-secrets
                  key: AUTH_DATABASE_URL
            - name: APP_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: demo-api-config
                  key: APP_MESSAGE
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
