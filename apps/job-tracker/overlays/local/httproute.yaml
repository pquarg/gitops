apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: job-tracker
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: web
  hostnames: [job-tracker.localhost]
  rules:
    # Preserve the original Ingress behavior for the bare path. Gateway
    # PathPrefix /api/ also matches /api, so this Exact match takes priority.
    - matches:
        - path:
            type: Exact
            value: /api
      backendRefs:
        - name: job-tracker-frontend
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /api/
      backendRefs:
        - name: job-tracker-api
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: job-tracker-frontend
          port: 80
