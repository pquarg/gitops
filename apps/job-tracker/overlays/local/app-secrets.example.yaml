# Copy to ignored app-secrets.yaml; fill privately. Never add to Kustomize.
apiVersion: v1
kind: Secret
metadata:
  name: job-tracker-secrets
  namespace: job-tracker
type: Opaque
stringData:
  JT_DATABASE_URL: postgresql+psycopg://job_tracker:REPLACE_PASSWORD@host.docker.internal:5433/job_tracker
  # Empty provider values keep AI/research explicitly unavailable.
  JT_AI_URL: ""
  JT_AI_MODEL: ""
  JT_AI_RETENTION: ""
  JT_AI_EXTERNAL: "true"
  JT_AI_KEY: ""
  JT_SEARCH_KEY: ""
  JT_SEARCH_RETENTION: ""
