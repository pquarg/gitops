# Copy to ignored app-secrets.yaml; fill privately. Never add to Kustomize.
apiVersion: v1
kind: Secret
metadata:
  name: job-tracker-secrets
  namespace: job-tracker
type: Opaque
stringData:
  JT_DATABASE_URL: postgresql+psycopg://job_tracker:REPLACE_PASSWORD@host.docker.internal:5433/job_tracker
  # Generate the key/host once in private env storage using the app's
  # scripts/prepare-chatgpt.py, then use configure-job-tracker.py.
  # Never copy this empty key/host over an existing connection installation.
  JT_AI_AUTH: chatgpt_plan
  JT_CHATGPT_ENCRYPTION_KEY: ""
  JT_CHATGPT_HOST_ID: ""
  JT_CHATGPT_CALLBACK_URI: http://127.0.0.1:1456/auth/callback
  # Plan mode never uses the server key. Never add this file to Kustomize.
  OPENAI_API_KEY: ""
  # Optional JT_AI_RETENTION override for verified account-specific processing terms.
