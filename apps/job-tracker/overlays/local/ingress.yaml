apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: job-tracker
spec:
  ingressClassName: traefik
  rules:
    - host: job-tracker.localhost
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: job-tracker-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: job-tracker-frontend
                port:
                  name: http
