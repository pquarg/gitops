apiVersion: v1
kind: Service
metadata:
  name: job-tracker-api
spec:
  selector:
    app: job-tracker-api
  ports:
    - name: http
      port: 80
      targetPort: http

---
apiVersion: v1
kind: Service
metadata:
  name: job-tracker-frontend
spec:
  selector:
    app: job-tracker-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
