apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: reaction-explorer
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: web
  hostnames:
    - reaction-explorer.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: reaction-explorer
          port: 80
