apiVersion: apps/v1
kind: Deployment
metadata:
  name: reaction-explorer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reaction-explorer
  template:
    metadata:
      labels:
        app: reaction-explorer
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/pquarg/reaction-explorer-web
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: reaction-explorer-config
            - secretRef:
                name: reaction-explorer-secrets
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /api/snapshots
              port: http
            periodSeconds: 10
            timeoutSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 64Mi
