apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./base
  - ./postgres
  - ingress.yaml
patches:
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: myfastapiapp-config
      data:
        APP_MESSAGE: "Hello from FastAPI on kind!"
images:
  # Sets the release image for both the API Deployment and migration Job.
  - name: ghcr.io/pquarg/myfastapiapp
    newTag: "0.1.12"
