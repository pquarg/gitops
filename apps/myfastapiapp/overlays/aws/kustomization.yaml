apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ingress.yaml
configMapGenerator:
  # Public AWS trust anchors, mounted into both the API and migration Job.
  # The content hash rolls the Deployment when the CA bundle is refreshed.
  - name: myfastapiapp-rds-ca
    files:
      - global-bundle.pem=certs/global-bundle.pem
images:
  # Sets the release image for both the API Deployment and migration Job.
  - name: ghcr.io/pquarg/myfastapiapp
    newTag: "0.1.12"
patches:
  - path: workload-patch.yaml
