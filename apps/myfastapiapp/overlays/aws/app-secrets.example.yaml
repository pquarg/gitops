# Copy to app-secrets.yaml and set the private RDS connection URL.
# Use an app-specific database role, URL-encode the password, and require TLS:
# postgresql://myfastapiapp:ENCODED_PASSWORD@RDS_ENDPOINT:5432/myfastapiapp?sslmode=verify-full
# PGSSLROOTCERT in both workload manifests points to the mounted public RDS CA bundle.
# Keep the filled file out of Git and out of kustomization.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: myfastapiapp-secrets
  namespace: myfastapiapp
type: Opaque
stringData:
  AUTH_DATABASE_URL: ""
