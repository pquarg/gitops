name: Validate deployment configuration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check shell script syntax
        run: |
          bash -n scripts/deploy-kind.sh
          bash -n scripts/setup-ingress-kind.sh
          bash -n scripts/backup-postgres.sh

      - name: Render Kubernetes manifests
        run: |
          kubectl kustomize apps/myfastapiapp/base > /dev/null
          kubectl kustomize apps/myfastapiapp/overlays/staging > /dev/null

      - name: Validate Docker Compose configuration
        env:
          KIND_NODE: argocd-postgres-control-plane
        run: docker compose -f kind/compose.yaml config --quiet
