apiVersion: apps/v1
kind: Deployment
metadata:
  name: myfastapiapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myfastapiapp
  template:
    metadata:
      labels:
        app: myfastapiapp
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: myfastapiapp
          image: ghcr.io/pquarg/myfastapiapp:beb48d15e8d975bd9b66dde0c8212698e33f4c04
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APP_MESSAGE
              value: "Hello from FastAPI on kind!"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
