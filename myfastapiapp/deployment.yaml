apiVersion: apps/v1
kind: Deployment
metadata:
  name: myfastapiapp-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myfastapiapp-pod # Matches template.metadata.labels below.
  template:
    metadata:
      labels:
        app: myfastapiapp-pod # Also selected by service.yaml's spec.selector.
    spec:
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: myfastapiapp-container
          # Published image in GHCR; independent of the container's name.
          image: ghcr.io/pquarg/myfastapiapp:0.1.5
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: AUTH_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: myfastapiapp-secrets
                  key: AUTH_DATABASE_URL
            - name: APP_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: myfastapiapp-config
                  key: APP_MESSAGE
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
