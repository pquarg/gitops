apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myfastapiapp
spec:
  ingressClassName: traefik
  rules:
    - host: myfastapiapp.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: myfastapiapp
                port:
                  number: 80
