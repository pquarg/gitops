apiVersion: v1
kind: PersistentVolume
metadata:
  name: myfastapiapp-postgres-pv
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  # Bind this fixed local directory, rather than the default provisioner's disk.
  storageClassName: ""
  claimRef:
    namespace: default
    name: myfastapiapp-postgres-pvc
  local:
    path: /mnt/myfastapiapp-postgres
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: myfastapiapp.local/postgres-storage
              operator: In
              values:
                - "true"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: myfastapiapp-postgres-pvc
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: myfastapiapp-postgres-pv
  resources:
    requests:
      storage: 1Gi
