apiVersion: apps/v1
kind: Deployment
metadata:
  name: myfastapiapp-deployment
spec:
  template:
    spec:
      containers:
        - name: myfastapiapp-container
          env:
            - name: AUTH_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: myfastapiapp-secrets
                  key: AUTH_DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
