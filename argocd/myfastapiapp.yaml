apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # Preserve the existing Application's identity and resource ownership.
  name: myfastapiapp-postgres-application
  namespace: argocd
  labels:
    environment: staging
spec:
  project: default
  source:
    repoURL: git@github.com:pquarg/deploy.git
    targetRevision: main
    path: apps/myfastapiapp
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      selfHeal: true
