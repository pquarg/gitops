apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: staging-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: git@github.com:pquarg/deploy.git
        revision: main
        directories:
          - path: apps/*
          # Keep the existing Application's identity and retained volume binding.
          - path: apps/myfastapiapp
            exclude: true
  ignoreApplicationDifferences:
    - jsonPointers:
        # A database release can pause auto-sync without the controller undoing it.
        - /spec/syncPolicy/automated
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: 'staging-{{.path.basename}}'
      namespace: argocd
      labels:
        environment: staging
    spec:
      project: default
      source:
        repoURL: git@github.com:pquarg/deploy.git
        targetRevision: main
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.path.basename}}'
      syncPolicy:
        automated:
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
