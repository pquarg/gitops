apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: myfastapiapp-postgres-application
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:pquarg/deploy.git
    targetRevision: HEAD
    path: overlays/kind-postgres
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      selfHeal: true
